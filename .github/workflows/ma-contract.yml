name: Music Assistant contract

on:
  schedule:
    - cron: "0 4 * * 1"  # Weekly, Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ma-contract:
    name: hass_players anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check upstream Music Assistant still makes the calls MyHOME relies on
        run: python scripts/check_ma_contract.py
